[package]
name = "discover-ruby"
description = "Deterministic Ruby codebase navigation (require graph, Zeitwerk autoloading, liveness, usages) built on ast-grep"
publish = false

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# Parsing and pattern matching run in-process with ast-grep's Ruby support.
ast-grep-core = { workspace = true, features = ["tree-sitter"] }
ast-grep-language.workspace = true
# Caches, liveness, the importers index, trace and the shared CLI.
discover-core = { path = "../discover-core" }
serde.workspace = true
serde_json = "1.0.116"
