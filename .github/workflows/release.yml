name: release

# Runs on merge to main. Reuses artifacts from a successful CI run for the
# same commit if available. Otherwise does a full build+test before releasing.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-ci-artifacts:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      has_artifacts: ${{ steps.find.outputs.has_artifacts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find successful CI run for this merge
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The merge commit SHA won't match the CI run — CI ran against
          # the PR head commit. Extract it from the merge's parent.
          PR_HEAD=$(git rev-parse HEAD^2 2>/dev/null || echo "")
          SHAS=("${{ github.sha }}")
          [[ -n "$PR_HEAD" ]] && SHAS+=("$PR_HEAD")

          RUN_ID=""
          for sha in "${SHAS[@]}"; do
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            [[ -n "$RUN_ID" ]] && break
          done

          if [[ -n "$RUN_ID" ]]; then
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
            echo "Found successful CI run: $RUN_ID"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "No prior CI run found — will do full build"
          fi

  build:
    needs: check-ci-artifacts
    if: needs.check-ci-artifacts.outputs.has_artifacts == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
            artifact: dist-linux-x86_64
          - os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
            artifact: dist-linux-aarch64
          - os: macos-latest
            targets: x86_64-apple-darwin
            artifact: dist-macos-x86_64
          - os: macos-latest
            targets: aarch64-apple-darwin
            artifact: dist-macos-aarch64
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            artifact: dist-windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('ast-grep/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install modern bash
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Syntax-check install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: Build static binaries
        run: ./bin/build-static --yes ${{ matrix.targets }}

      - name: Package release archives
        run: ./bin/package-release --version "$(cat VERSION).${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  test:
    needs: [check-ci-artifacts, build]
    if: needs.check-ci-artifacts.outputs.has_artifacts == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist

      - name: Put built ast-grep and repo bin/ on PATH
        run: |
          tar -xzf dist/ast-grep-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP"/ast-grep-*-linux-x86_64 >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Verify binary runs
        run: ast-grep --version

      - name: Run test suite
        run: bash tests/run.sh

  download-ci-artifacts:
    needs: check-ci-artifacts
    if: needs.check-ci-artifacts.outputs.has_artifacts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts from CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh api "repos/${{ github.repository }}/actions/runs/${{ needs.check-ci-artifacts.outputs.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("dist-")) | "\(.id) \(.name)"' | \
          while read -r id name; do
            echo "Downloading $name..."
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$name.zip"
            unzip -o "$name.zip" -d dist/
            rm "$name.zip"
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-all
          path: dist/
          if-no-files-found: error

  release:
    needs: [check-ci-artifacts, build, test, download-ci-artifacts]
    if: always() && (needs.test.result == 'success' || needs.download-ci-artifacts.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.check-ci-artifacts.outputs.has_artifacts == 'false'
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.check-ci-artifacts.outputs.has_artifacts == 'true'
        with:
          name: dist-all
          path: dist

      - name: Assemble release assets
        run: |
          TAG="v$(cat VERSION).${GITHUB_RUN_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ./bin/package-framework --version "$TAG"
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -lh dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "discover $TAG" \
            --generate-notes \
            dist/*
